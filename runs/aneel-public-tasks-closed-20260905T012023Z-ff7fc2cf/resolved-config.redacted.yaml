name: aneel-public-tasks-closed
dataset:
  path: /workspace/agentic-eval/examples/public_tasks.jsonl
  id_field: task_id
  question_field: instruction
  reference_answer_field: null
  tags_field: null
  metadata_field: null
  timeout_field: null
model:
  provider_id: vllm
  model_id: Qwen/Qwen3-0.6B
  base_url: http://127.0.0.1:8080/v1
  api_key: '***REDACTED***'
  context_limit: 20480
  output_limit: 2048
  request_timeout_seconds: 240.0
  chunk_timeout_seconds: 60.0
harness:
  name: opencode
  mode: managed
  binary: /root/.opencode/bin/opencode
  version: 1.18.21
  workers: 1
  host: 127.0.0.1
  startup_timeout_seconds: 30.0
  shutdown_timeout_seconds: 5.0
  attach_urls: []
  attach_username: opencode
  attach_password: null
  tool_policy:
    allow:
    - aneel_*
    deny:
    - websearch
    - webfetch
    - bash
    - edit
    - write
    - read
    - glob
    - grep
environment:
  kind: aneel_corpus
  database_path: /workspace/agentic-eval/data/processed/aneel-corpus.sqlite3
  manifest_path: /workspace/agentic-eval/data/processed/aneel-corpus.manifest.json
  server_name: aneel
  max_tool_steps: 10
  families:
  - resolucao_normativa
task:
  system_prompt: 'Use exclusivamente as ferramentas ANEEL; não use conhecimento externo.

    Sua PRIMEIRA ação deve ser chamar aneel_search_resolucao_normativa com uma

    consulta curta extraída da pergunta. Não escreva texto antes dessa chamada.

    Examine os resultados e use aneel_get_aneel_document para ler continuações

    quando necessário. Sua ÚLTIMA ação deve ser chamar aneel_finish com a

    resposta completa em português e todos os document_id de evidência. É

    proibido responder diretamente sem aneel_finish. Não invente fatos.

    '
  question_template: 'Pergunta: {question}

    '
  source_profile_path: null
  source_profile: null
  qualification_system_prompt: 'Execute exatamente uma chamada da ferramenta aneel_get_aneel_corpus_stats.

    Não escreva explicações antes da chamada.

    '
  qualification_question: 'Chame agora aneel_get_aneel_corpus_stats, sem argumentos.

    '
output_dir: /workspace/agentic-eval/runs
concurrency: 1
timeout_seconds: 300.0
infrastructure_retries: 0
case_ids: []
tags: []
shard_index: 0
shard_count: 1
max_tool_payload_bytes: 1000000
